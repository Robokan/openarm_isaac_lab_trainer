# Pick Up Cube - Example Script for OpenArm Bimanual IK Teleoperation
#
# Usage:
#   ./scripts/teleop_xr.sh --script scripts/examples/pick_up_cube.yaml

# Spawn the cube
- spawn_cube: {name: block1, random_area: {x: [0.25, 0.4], y: [-0.0, 0.15], z: [0.5, 0.5]}}

# Step 1: Lift arm above table (keep current orientation)
- print: "Lifting arm above table"
- move_to: {arm: left, position: [0.0, 0.25, 0.50], duration: 1.0}
- wait_until_reached: {arm: left}

# Step 2: Move above the cube (auto-orients toward cube)
- print: "Moving above block1 (auto-orient)"
- move_to: {arm: left, to: block1, above: 0.00, duration: 1.5}
- wait_until_reached: {arm: left}

# # Step 3: Lower onto the cube (continues auto-orient)
# - print: "Lowering onto block1"
# - move_to: {arm: left, to: block1, above: 0.0, duration: 0.5}
# - wait_until_reached: {arm: left}

# Step 4: Grasp
- print: "Grasping"
- close_gripper: {arm: left, force: 0.5, duration: 0.5}

# Step 5: Lift
- print: "Lifting block1"
- move_to: {arm: left, position: [0.25, 0.50, 0.60], duration: 1.5}
- wait_until_reached: {arm: left}

- print: "Grasping"
- open_gripper: {arm: left}
# - print: "Done!"
